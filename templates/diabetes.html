{% extends "base.html" %}
{% block content %}

<div class="min-h-screen bg-base-200 py-10 px-4">
    <div class="card w-full max-w-4xl mx-auto bg-base-100 shadow-xl">
        <div class="card-body">
            
            <div class="flex flex-col md:flex-row justify-between items-center border-b border-base-300 pb-6 mb-6">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-blue-50 rounded-full text-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    </div>
                    <div>
                        <h2 class="card-title text-3xl font-bold text-base-content">Diabetes Check</h2>
                        <p class="text-base-content/70 text-sm">Predictive screening based on diagnostic measures.</p>
                    </div>
                </div>
                <div class="badge badge-primary badge-outline p-3 mt-4 md:mt-0">Endocrine Model v1.0</div>
            </div>

            <form action="{{ url_for('prediction_controller.diabetes') }}" method="POST">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div class="bg-base-50 p-5 rounded-xl border border-base-200">
                        <h3 class="font-bold text-blue-500 uppercase text-xs tracking-wider mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            Profile
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Age</span></label>
                                <input type="number" step="any" name="age" placeholder="Years" class="input input-bordered w-full focus:input-primary" required />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Pregnancies</span></label>
                                <input type="number" step="any" name="pregnancies" placeholder="Count (0 if male)" class="input input-bordered w-full focus:input-primary" required />
                            </div>
                        </div>
                    </div>

                    <div class="bg-base-50 p-5 rounded-xl border border-base-200">
                        <h3 class="font-bold text-blue-500 uppercase text-xs tracking-wider mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            Physical Metrics
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">BMI</span></label>
                                <input type="number" step="any" name="bmi" placeholder="Index" class="input input-bordered w-full focus:input-primary" required />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">BP</span></label>
                                <div class="tooltip" data-tip="Diastolic Blood Pressure">
                                    <input type="number" step="any" name="bloodpressure" placeholder="mm Hg" class="input input-bordered w-full focus:input-primary" required />
                                </div>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Skin Fold</span></label>
                                <div class="tooltip" data-tip="Triceps skin fold thickness">
                                    <input type="number" step="any" name="skinthickness" placeholder="mm" class="input input-bordered w-full focus:input-primary" required />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-base-50 p-5 rounded-xl border border-base-200 md:col-span-2">
                        <h3 class="font-bold text-blue-500 uppercase text-xs tracking-wider mb-4 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                            Laboratory Indicators
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Glucose</span></label>
                                <input type="number" step="any" name="glucose" placeholder="mg/dL" class="input input-bordered w-full focus:input-primary" required />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Insulin</span></label>
                                <div class="tooltip" data-tip="2-Hour serum insulin">
                                    <input type="number" step="any" name="insulin" placeholder="mu U/ml" class="input input-bordered w-full focus:input-primary" required />
                                </div>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text font-medium">Diabetes Pedigree</span></label>
                                <div class="tooltip" data-tip="Diabetes Pedigree Function (Family History Score)">
                                    <input type="number" step="any" name="dpf" placeholder="0.0 - 2.5" class="input input-bordered w-full focus:input-primary" required />
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="card-actions justify-end mt-8 pt-6 border-t border-base-300">
                    <button type="reset" class="btn btn-ghost hover:bg-base-200">Reset</button>
                    <button type="submit" class="btn btn-primary px-8">
                        Analyze Risk
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                    </button>
                </div>
            </form>

            {% if result %}
            <div class="mt-8 animate-fade-in-up">
                <div class="alert shadow-lg {% if 'Positive' in result or 'Diabetic' in result %}alert-warning{% else %}alert-success{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <div>
                        <h3 class="font-bold">Analysis Complete</h3>
                        <div class="text-sm">{{ result }}</div>
                    </div>
                </div>
            </div>
            {% endif %}

        </div>
    </div>
</div>
{% endblock %}
