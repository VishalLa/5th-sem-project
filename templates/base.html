<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans leading-normal tracking-normal">

    <nav class="bg-blue-600 p-4 shadow-md">
        <div class="container mx-auto flex flex-wrap items-center justify-between">
            <a href="/" class="flex items-center text-white text-xl font-bold no-underline hover:text-gray-200">
                🧑‍⚕️ Health Assistant
            </a>
            
            <div class="block lg:hidden">
                <button class="flex items-center px-3 py-2 border rounded text-blue-200 border-blue-400 hover:text-white hover:border-white">
                    <svg class="fill-current h-3 w-3" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><title>Menu</title><path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"/></svg>
                </button>
            </div>

            <div class="w-full block flex-grow lg:flex lg:items-center lg:w-auto hidden lg:block pt-6 lg:pt-0" id="nav-content">
                <ul class="list-reset lg:flex justify-end flex-1 items-center">
                    <li class="mr-3">
                        <a class="inline-block text-blue-100 hover:text-white py-2 px-4 font-semibold" href="/diabetes">Diabetes</a>
                    </li>
                    <li class="mr-3">
                        <a class="inline-block text-blue-100 hover:text-white py-2 px-4 font-semibold" href="/heart">Heart Disease</a>
                    </li>
                    <li class="mr-3">
                        <a class="inline-block text-blue-100 hover:text-white py-2 px-4 font-semibold" href="/parkinsons">Parkinson's</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mx-auto mt-10 px-4 mb-10">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
