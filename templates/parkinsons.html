{% extends "base.html" %}
{% block content %}

<div class="min-h-screen bg-base-200 py-10 px-4">
    <div class="card w-full max-w-6xl mx-auto bg-base-100 shadow-xl">
        <div class="card-body">
            
            <div class="flex flex-col md:flex-row justify-between items-center border-b border-base-300 pb-6 mb-6">
                <div>
                    <h2 class="card-title text-3xl font-bold text-primary">Parkinson's Prediction</h2>
                    <p class="text-base-content/70 mt-1">Enter the voice measurement metrics below.</p>
                </div>
                <div class="badge badge-outline p-3 mt-4 md:mt-0">ML Model v1.0</div>
            </div>
    
            <form action="{{ url_for('prediction_controller.parkinsons') }}" method="POST">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    
                    <div class="bg-base-50 p-6 rounded-xl border border-base-200">
                        <h3 class="text-lg font-semibold text-secondary mb-4 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
                            Fundamental Frequency
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">MDVP:Fo(Hz)</span></label>
                                <input type="number" step="any" name="fo" placeholder="Avg" class="input input-bordered input-sm w-full focus:input-primary" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">MDVP:Fhi(Hz)</span></label>
                                <input type="number" step="any" name="fhi" placeholder="Max" class="input input-bordered input-sm w-full focus:input-primary" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">MDVP:Flo(Hz)</span></label>
                                <input type="number" step="any" name="flo" placeholder="Min" class="input input-bordered input-sm w-full focus:input-primary" required />
                            </div>
                        </div>
                    </div>

                    <div class="bg-base-50 p-6 rounded-xl border border-base-200">
                        <h3 class="text-lg font-semibold text-secondary mb-4 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                            Jitter Metrics
                        </h3>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">MDVP:Jitter(%)</span></label>
                                <input type="number" step="any" name="jitter_percent" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">MDVP:Jitter(Abs)</span></label>
                                <input type="number" step="any" name="jitter_abs" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">MDVP:RAP</span></label>
                                <input type="number" step="any" name="rap" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">MDVP:PPQ</span></label>
                                <input type="number" step="any" name="ppq" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">Jitter:DDP</span></label>
                                <input type="number" step="any" name="ddp" class="input input-bordered input-sm w-full" required />
                            </div>
                        </div>
                    </div>

                    <div class="bg-base-50 p-6 rounded-xl border border-base-200 lg:col-span-2">
                        <h3 class="text-lg font-semibold text-secondary mb-4 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                            Shimmer Metrics
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">MDVP:Shimmer</span></label>
                                <input type="number" step="any" name="shimmer" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">Shimmer(dB)</span></label>
                                <input type="number" step="any" name="shimmer_db" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">Shimmer:APQ3</span></label>
                                <input type="number" step="any" name="apq3" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">Shimmer:APQ5</span></label>
                                <input type="number" step="any" name="apq5" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">MDVP:APQ</span></label>
                                <input type="number" step="any" name="apq" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text text-xs">Shimmer:DDA</span></label>
                                <input type="number" step="any" name="dda" class="input input-bordered input-sm w-full" required />
                            </div>
                        </div>
                    </div>

                    <div class="bg-base-50 p-6 rounded-xl border border-base-200 lg:col-span-2">
                        <h3 class="text-lg font-semibold text-secondary mb-4 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>
                            Harmonic & Nonlinear Features
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">NHR</span></label>
                                <input type="number" step="any" name="nhr" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">HNR</span></label>
                                <input type="number" step="any" name="hnr" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">RPDE</span></label>
                                <input type="number" step="any" name="rpde" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">DFA</span></label>
                                <input type="number" step="any" name="dfa" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">spread1</span></label>
                                <input type="number" step="any" name="spread1" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">spread2</span></label>
                                <input type="number" step="any" name="spread2" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">D2</span></label>
                                <input type="number" step="any" name="d2" class="input input-bordered input-sm w-full" required />
                            </div>
                            <div class="form-control w-full">
                                <label class="label"><span class="label-text font-medium">PPE</span></label>
                                <input type="number" step="any" name="ppe" class="input input-bordered input-sm w-full" required />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-actions justify-end mt-8 border-t border-base-300 pt-6">
                    <button type="reset" class="btn btn-ghost mr-2">Clear Form</button>
                    <button type="submit" class="btn btn-primary btn-wide text-lg">
                        Predict
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                    </button>
                </div>
            </form>

            {% if result %}
            <div class="mt-8">
                <div class="alert shadow-lg {% if 'Parkinson' in result %}alert-warning{% else %}alert-success{% endif %}">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div>
                        <h3 class="font-bold">Prediction Result</h3>
                        <div class="text-lg">{{ result }}</div>
                    </div>
                </div>
            </div>
            {% endif %}
            
        </div>
    </div>
</div>
{% endblock %}
